{{- $title := partial "utils/seo-title.html" . -}}
{{- $description := partial "utils/seo-description.html" . -}}
{{- $image := partial "utils/seo-image.html" . -}}
<meta name="twitter:card" content="{{ if $image.url }}summary_large_image{{ else }}summary{{ end }}" />
<meta name="twitter:title" content="{{ $title }}" />
<meta name="twitter:description" content="{{ $description }}" />
{{- with $image.url }}
<meta name="twitter:image" content="{{ . }}" />
<meta name="twitter:image:alt" content="{{ $image.alt }}" />
{{- end -}}
